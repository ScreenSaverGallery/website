<div class="controls" fxLayout="row" [fxLayoutAlign]="(!homePage ? 'space-between center' : 'end center')">
    <div class="back" *ngIf="!homePage">
        <button mat-icon-button (click)="goBack()">
            <mat-icon>arrow_back</mat-icon>
        </button>
    </div>
    
    <div class="get" *ngIf="!homePage">
        <button *ngIf="getPage; else downloadButton" mat-icon-button [routerLink]="homeLink">
            <app-ssg-icon [flat]="true" [flatColor]="'white'" [size]="36"></app-ssg-icon>
        </button>
        <ng-template #downloadButton>
            <button *ngIf="siteTitle" mat-raised-button [routerLink]="homeLink">Get {{siteTitle}}</button>
        </ng-template>
    </div>
    
    <!-- <div class="info" *ngIf="home">
        <ssg-info-slider [addMessage]="addMessage" [align]="'center'"></ssg-info-slider>
    </div> -->

    <div class="sandwitch" #sandwitch [ngClass]="{'home': homePage}">
        <button  mat-icon-button (click)="toggleMenu(drawer.toggle())">
            <mat-icon>menu</mat-icon>
        </button>
    </div>
</div>

<div class="theme">
    <button mat-icon-button (click)="toggleTheme()">
        <mat-icon>invert_colors</mat-icon>
    </button>
</div>

<mat-drawer-container class="drawer-container">
    <mat-drawer #drawer mode="side" position="end" closed>
        <div class="close-menu">
            <button mat-icon-button (click)="closeMenu(drawer.close())">
                <mat-icon>close</mat-icon>
            </button>
        </div>
        <ssg-search></ssg-search>
        <ng-container *ngIf="categories && pages; else loading">
            <nav>
                <div class="menu-blocks" fxLayout="row wrap" fxLaout.lt-md="column" fxLayoutGap="6%">
                    <!-- ARCHIVES -->
                    <div class="archives" fxFlex="44%" fxFlex.lt-md="100%">
                        <!-- CURRENT SHOW -->
                        <p *ngIf="currentShow">
                            <a [routerLink]="'/' + currentShow.slug" (click)="closeMenu(drawer.close())"><span class="link-content" [innerHtml]="'Current Show'"></span></a>
                        </p>
                        <ng-container *ngFor="let cat of categories">
                            <!-- TOP CATEGORIES -->
                            <ng-container *ngIf="cat?.parent === 0">
                                <p>
                                    <a
                                        [routerLink]="'/archive/' + cat.slug"
                                        [state]="{type: 'category'}"
                                        routerLinkActive="active"
                                        (click)="closeMenu(drawer.close())"
                                    ><span class="link-content" [innerHtml]="cat.name | titlecase | safeHtml"></span></a>
                                </p>
                            </ng-container>
                        </ng-container>
                    </div>

                    <!-- PAGES -->
                    <div class="pages" fxFlex="44%" fxFlex.lt-md="100%">
                        <ng-container *ngFor="let page of pages">
                            <ng-container *ngIf="page.content.rendered">
                                <p>
                                    <a
                                        [routerLink]="'/' + page.slug"
                                        (click)="closeMenu(drawer.close())"
                                    ><span class="link-content" [innerHtml]="page.title.rendered | titlecase | safeHtml"></span></a></p>
                            </ng-container>
                        </ng-container>
                    </div>
                </div>
            </nav>
            <div>
                TODO: add social here
            </div>
        </ng-container>
        
        <ng-template #loading>
            <div>
                Loading ...
            </div>
        </ng-template>
    </mat-drawer>
</mat-drawer-container>
