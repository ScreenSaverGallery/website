<ng-container *ngIf="starsText">
    <app-stars [color]="'white'"></app-stars>
</ng-container>

<div class="home" fxLayout="column" fxLayoutAlign="center center">
    <div class="get-ssg" fxLayout="column" fxLayoutAlign="center cetner" (click)="goToDownload()">
        <app-ssg-icon [size]="200" [animated]="false" [flat]="themeIsBw()" [flatColor]="'white'"></app-ssg-icon>
        <button mat-raised-button color="primary" class="get-ssg-button">
            <h4>Get ScreenSaver</h4>
        </button>
    </div>
</div>
